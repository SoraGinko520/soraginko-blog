# 基于 MmzMing/my-blog 的友链流程；SoraGinko 增加人工批准与提交前检查。
name: 友链申请检查与审核

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: friend-links-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-friends:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.body, '### 网站名称') &&
      contains(github.event.issue.body, '### 网站链接') &&
      (github.event_name == 'issues' ||
       (github.event.comment.user.type != 'Bot' &&
        (startsWith(github.event.comment.body, '/approve-friend') ||
         startsWith(github.event.comment.body, '/recheck-friend'))))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      # 仅此 CI 下载与运行现有 Playwright，博客开发与本地验收不运行它。
      - name: Install Chromium for CI validation
        run: pnpm exec playwright install --with-deps chromium
      - name: Validate and process friend request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = require('node:path');
            const handler = require(path.join(process.env.GITHUB_WORKSPACE, '.github/scripts/process-friend-request.cjs'));
            await handler({ github, context, core });
